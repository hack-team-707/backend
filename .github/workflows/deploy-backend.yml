name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: |
            dist
            ecosystem.config.cjs
            package.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to EC2
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: release

      - name: Copy release to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: release/*
          target: /home/ec2-user/resolve-backend/releases/${{ github.sha }}
          strip_components: 1

      - name: Activate release
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RELEASE_SHA
          script_stop: true
          script: |
            set -eu

            APP_ROOT=/home/ec2-user/resolve-backend
            RELEASE_DIR="$APP_ROOT/releases/$RELEASE_SHA"
            CURRENT_LINK="$APP_ROOT/current"

            test -f "$RELEASE_DIR/package.json"
            test -f "$RELEASE_DIR/pnpm-lock.yaml"
            test -f "$RELEASE_DIR/dist/main.js"
            test -f "$RELEASE_DIR/ecosystem.config.cjs"

            cd "$RELEASE_DIR"

            if [ -f "$APP_ROOT/.env" ]; then
              ln -sfn "$APP_ROOT/.env" .env
            fi

            pnpm install --prod --frozen-lockfile

            PREVIOUS_RELEASE=""
            if [ -L "$CURRENT_LINK" ]; then
              PREVIOUS_RELEASE="$(readlink -f "$CURRENT_LINK")"
            fi

            ln -sfnT "$RELEASE_DIR" "$CURRENT_LINK"

            pm2 startOrReload "$CURRENT_LINK/ecosystem.config.cjs" --update-env

            HEALTHY=0
            ATTEMPT=1
            while [ "$ATTEMPT" -le 10 ]; do
              if curl --fail --silent --show-error \
                http://localhost:3000/api/health >/dev/null; then
                HEALTHY=1
                break
              fi
              sleep 3
              ATTEMPT=$((ATTEMPT + 1))
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Health check failed; restoring previous release."
              if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
                ln -sfnT "$PREVIOUS_RELEASE" "$CURRENT_LINK"
                pm2 startOrReload \
                  "$CURRENT_LINK/ecosystem.config.cjs" \
                  --update-env || true
              fi
              exit 1
            fi

            pm2 save
