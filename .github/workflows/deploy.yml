name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies and build
        run: pnpm install && pnpm run build

      - name: Copy artifacts to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'dist/,package.json,pnpm-lock.yaml'
          target: /home/ec2-user/resolve-backend

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/resolve-backend

            # Backup current deployment
            cp -r dist dist.bak 2>/dev/null || true

            # Install production dependencies
            pnpm install --prod

            # Run TypeORM migrations (skip if no data-source or no migrations)
            if [ -f dist/data-source.js ]; then
              npx typeorm migration:run -d dist/data-source.js 2>&1 || echo "No migrations to run or migration skipped"
            else
              echo "No data-source.js found, skipping migrations"
            fi

            # Start or restart application
            pm2 start /home/ec2-user/ecosystem.config.js 2>/dev/null || pm2 restart resolve-api

            # Wait for application to start
            sleep 5

            # Health check
            curl -f http://localhost:3000/api/health || {
              echo "Health check failed, rolling back..."
              rm -rf dist && mv dist.bak dist 2>/dev/null || true
              pm2 restart resolve-api 2>/dev/null || true
              exit 1
            }

            # Cleanup and save
            rm -rf dist.bak
            pm2 save
